name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-slim
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm to latest (required for Trusted Publishing)
        run: npm install -g npm@latest

      - name: Download artifact from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release -R "${{ github.repository }}" download "${{ github.ref_name }}" --pattern "pumpkinmc-pumpkin-api-ts-*.tgz" --dir .

      - name: Publish to npm
        run: npm publish pumpkinmc-pumpkin-api-ts-*.tgz --provenance --access public
